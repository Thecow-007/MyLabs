name: Android CI

on:
  pull_request:
    branches: [ "main" ]

jobs:
  instrumented-tests:

    runs-on: ubuntu-latest

    steps:
      # Checks out the repository's code
      - name: Checkout code
        uses: actions/checkout@v4

      # Sets up the Java version specified in the tutorial
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: gradle

      # Grants execute permission to the gradlew script
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      #  Enables KVM for emulator acceleration
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Runs the emulator and executes my tests (Lab7Tests.kt)
      - name: Run Emulator Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          script: ./gradlew connectedCheck